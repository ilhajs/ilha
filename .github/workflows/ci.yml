name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Void requires Node.js 24.21 or newer to build the template.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Build templates
        run: bun run --filter './templates/*' build

      - name: Check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish preview packages
        if: github.event_name != 'pull_request'
        run: |
          echo "gitdir: $(pwd)/.git" > packages/ilha/.git
          bunx pkg-pr-new publish './packages/*'

      - name: Upload package dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lib-dist
          path: packages/*/dist/
          retention-days: 1

  docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Download package dist
        uses: actions/download-artifact@v8
        with:
          name: lib-dist
          path: packages/

      - name: Build website
        run: bun run build
        working-directory: apps/website

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist/

      # deploy-pages looks the artifact up right after upload, and the
      # artifacts API can lag by seconds (actions/deploy-pages#451): the
      # first lookup then finds nothing. Rerunning the job can't help (it
      # finds two artifacts), so retry the deploy in-job after a wait.
      - name: Deploy to GitHub Pages
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for the Pages artifact
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (retry)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait longer for the Pages artifact
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (last retry)
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
